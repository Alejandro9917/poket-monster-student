services:
  pokebattle-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pokebattle-api:latest
    container_name: pokebattle-api
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
    restart: unless-stopped
  pokebattle-web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    image: pokebattle-web:latest
    container_name: pokebattle-web
    ports:
      - "3000:3000"
    depends_on:
      - pokebattle-api
    restart: unless-stopped
